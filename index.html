<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wok Bros - Mario Runner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0d0809;
      color: #fff;
      font-family: 'Press Start 2P', monospace, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      width: 100%;
      flex: 1;
      background: #5c94fc;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    #bottom-panel {
      height: 42vh;
      background: #181112;
      border-top: 4px solid #d32228;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px 14px;
    }

    .promo-bar {
      background: #2b1314;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .promo-text {
      font-size: 8px;
      line-height: 1.5;
      color: #fff;
    }

    .promo-text strong {
      color: #ffcc00;
      font-size: 9px;
      display: block;
      margin-bottom: 2px;
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
      text-decoration: none;
      font-size: 9px;
      font-weight: bold;
      padding: 9px 12px;
      border-radius: 8px;
      white-space: nowrap;
      border: 2px solid #1aa84f;
      box-shadow: 0 4px 0 #12632f;
    }

    .btn-wa:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      padding: 8px 0 0;
    }

    .dpad-info {
      font-size: 8px;
      color: #ccc;
      line-height: 1.8;
      background: #24191a;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #442a2b;
      max-width: 140px;
    }

    .jump-btn-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .btn-jump {
      width: 100px;
      height: 100px;
      background: linear-gradient(180deg, #e52521 0%, #a81310 100%);
      border: 4px solid #ffcc00;
      border-radius: 50%;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #6e0907, 0 10px 20px rgba(0,0,0,0.6);
      cursor: pointer;
    }

    .btn-jump:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #6e0907;
      background: #ff3b37;
    }

    .jump-label {
      font-size: 8px;
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="bottom-panel">
    <div class="promo-bar">
      <div class="promo-text">
        <strong>WOK BROS 🥡</strong>
        ¿CUÁL ES LA PROMO DE HOY?
      </div>
      <a href="https://wa.me/56991081769?text=Hola%20Wok%20Bros!%20Tengo%20el%20cartucho%20gamer,%20%C2%BFcu%C3%A1l%20es%20la%20promoci%C3%B3n%20sorpresa%20de%20hoy?" class="btn-wa">
        WHATSAPP
      </a>
    </div>

    <div class="controls-row">
      <div class="dpad-info">
        ★ MODO RUNNER ★<br>
        Mario corre por el suelo. ¡Toca SALTAR para esquivar tuberías y tortugas!
      </div>

      <div class="jump-btn-area">
        <button class="btn-jump" id="jumpBtn">SALTAR</button>
        <span class="jump-label">TOCA PARA SALTAR</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Carga de la imagen original subida a GitHub
    const marioImg = new Image();
    marioImg.src = 'mario.gif';

    let frames = 0;
    let score = 0;
    let highScore = 0;
    let gameState = 'START';
    const floorHeight = 36;

    const mario = {
      x: 45,
      y: 0,
      w: 28,
      h: 42,
      vy: 0,
      gravity: 0.58,
      jumpPower: -11.5,
      isGrounded: false,
      runBob: 0,

      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        const groundLevel = canvas.height - floorHeight - this.h;
        if (this.y >= groundLevel) {
          this.y = groundLevel;
          this.vy = 0;
          this.isGrounded = true;
        } else {
          this.isGrounded = false;
        }

        if (this.isGrounded) {
          this.runBob = Math.sin(frames * 0.35) * 2.5;
        } else {
          this.runBob = 0;
        }
      },

      jump() {
        if (this.isGrounded) {
          this.vy = this.jumpPower;
          this.isGrounded = false;
        }
      },

      draw() {
        ctx.save();
        ctx.imageSmoothingEnabled = false;

        if (this.isGrounded) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          ctx.fillRect(this.x + 3, canvas.height - floorHeight - 3, this.w - 6, 3);
        }

        const angle = this.isGrounded ? (Math.sin(frames * 0.35) * 0.06) : -0.1;
        ctx.translate(this.x + this.w / 2, this.y + this.runBob + this.h / 2);
        ctx.rotate(angle);

        if (marioImg.complete && marioImg.naturalWidth !== 0) {
          ctx.drawImage(marioImg, -this.w / 2, -this.h / 2, this.w, this.h);
        } else {
          // Respaldo visible por si la imagen tarda en cargar
          ctx.fillStyle = '#e52521';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
        }

        ctx.restore();
      },

      reset() {
        this.y = canvas.height - floorHeight - this.h;
        this.vy = 0;
        this.isGrounded = true;
      }
    };

    const obstacles = {
      items: [],
      speed: 3.2,
      spawnTimer: 0,

      update() {
        this.spawnTimer++;
        if (this.spawnTimer > 80 + Math.random() * 45) {
          this.spawnTimer = 0;
          const isTurtle = Math.random() > 0.45;
          if (isTurtle) {
            this.items.push({
              type: 'koopa',
              x: canvas.width + 10,
              y: canvas.height - floorHeight - 24,
              w: 24,
              h: 24
            });
          } else {
            const pipeH = 32 + Math.floor(Math.random() * 14);
            this.items.push({
              type: 'pipe',
              x: canvas.width + 10,
              y: canvas.height - floorHeight - pipeH,
              w: 30,
              h: pipeH
            });
          }
        }

        for (let i = 0; i < this.items.length; i++) {
          const obs = this.items[i];
          obs.x -= this.speed;

          const pad = 6;
          if (
            mario.x + mario.w - pad > obs.x &&
            mario.x + pad < obs.x + obs.w &&
            mario.y + mario.h > obs.y + pad
          ) {
            gameOver();
          }

          if (obs.x + obs.w < mario.x && !obs.scored) {
            score++;
            obs.scored = true;
          }

          if (obs.x + obs.w < -20) {
            this.items.splice(i, 1);
            i--;
          }
        }
      },

      draw() {
        for (let obs of this.items) {
          if (obs.type === 'pipe') {
            ctx.fillStyle = '#00a800';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#007000';
            ctx.fillRect(obs.x - 2, obs.y, obs.w + 4, 10);
            ctx.fillStyle = '#2de02d';
            ctx.fillRect(obs.x + 3, obs.y + 2, 4, obs.h - 2);
          } else if (obs.type === 'koopa') {
            ctx.fillStyle = '#00a800';
            ctx.beginPath();
            ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffcca3';
            ctx.fillRect(obs.x - 3, obs.y + 7, 6, 8);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(obs.x + 7, obs.y + 7, 8, 8);
          }
        }
      },

      reset() {
        this.items = [];
        this.spawnTimer = 0;
      }
    };

    function gameOver() {
      gameState = 'GAMEOVER';
      if (score > highScore) highScore = score;
    }

    function triggerAction() {
      if (gameState === 'START') {
        gameState = 'PLAY';
        mario.reset();
        obstacles.reset();
        score = 0;
        mario.jump();
      } else if (gameState === 'PLAY') {
        mario.jump();
      } else if (gameState === 'GAMEOVER') {
        gameState = 'START';
      }
    }

    document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerAction();
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerAction();
    }, { passive: false });

    function loop() {
      ctx.fillStyle = '#5c94fc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fillRect(30, 30, 50, 14);
      ctx.fillRect(45, 22, 35, 16);
      ctx.fillRect(180, 50, 60, 14);

      const groundY = canvas.height - floorHeight;
      ctx.fillStyle = '#d88b28';
      ctx.fillRect(0, groundY, canvas.width, floorHeight);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, groundY, canvas.width, 3);

      ctx.fillStyle = '#b05d15';
      for (let x = 0; x < canvas.width; x += 32) {
        ctx.fillRect(x + (frames % 32), groundY + 8, 28, 6);
        ctx.fillRect(x + ((frames + 16) % 32), groundY + 20, 28, 6);
      }

      if (gameState === 'PLAY') {
        obstacles.update();
        obstacles.draw();
        mario.update();
        mario.draw();
        frames++;

        ctx.fillStyle = '#ffffff';
        ctx.font = '13px "Press Start 2P"';
        ctx.fillText("SCORE " + score, 16, 28);

      } else if (gameState === 'START') {
        mario.reset();
        mario.draw();
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("MARIO RUNNER", canvas.width / 2, canvas.height / 2 - 25);
        ctx.fillStyle = '#ffcc00';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("TOCA SALTAR PARA EMPEZAR", canvas.width / 2, canvas.height / 2 + 10);
        ctx.textAlign = 'left';

      } else if (gameState === 'GAMEOVER') {
        obstacles.draw();
        mario.draw();
        ctx.fillStyle = '#000000';
        ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 - 55, 240, 95);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width / 2 - 120, canvas.height / 2 - 55, 240, 95);

        ctx.fillStyle = '#e52521';
        ctx.font = '12px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 25);

        ctx.fillStyle = '#ffffff';
        ctx.font = '8px "Press Start 2P"';
        ctx.fillText("PUNTOS: " + score, canvas.width / 2, canvas.height / 2);
        ctx.fillText("RECORD: " + highScore, canvas.width / 2, canvas.height / 2 + 18);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
